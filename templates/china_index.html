<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国房价预测系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060912;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #7c5cfc;
      --gold: #f5a623;
      --teal: #00c9a7;
      --text: #f0f2ff;
      --muted: #7b8ab8;
      --input: rgba(255, 255, 255, 0.055);
      --radius: 14px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); animation: float 12s ease-in-out infinite alternate; }
    .orb1 { width: 600px; height: 600px; background: rgba(124, 92, 252, 0.12); top: -200px; left: -150px; }
    .orb2 { width: 500px; height: 500px; background: rgba(0, 201, 167, 0.08); bottom: -150px; right: -100px; }
    .orb3 { width: 300px; height: 300px; background: rgba(245, 166, 35, 0.07); top: 40%; left: 55%; }
    @keyframes float { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, 30px) scale(1.08); } }
    header { position: relative; z-index: 10; text-align: center; padding: 3.5rem 1.5rem 2.5rem; }
    .tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(124, 92, 252, 0.15); border: 1px solid rgba(124, 92, 252, 0.3); border-radius: 30px; padding: 5px 16px; font-size: 0.72rem; letter-spacing: 1.5px; color: #b09fff; font-weight: 600; text-transform: uppercase; margin-bottom: 1.2rem; }
    .tag-dot { width: 7px; height: 7px; background: #7c5cfc; border-radius: 50%; box-shadow: 0 0 8px #7c5cfc; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 900; line-height: 1.1; background: linear-gradient(135deg, #ffffff 0%, #c4b8ff 45%, #00c9a7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
    .subtitle { margin-top: 0.7rem; font-size: 1rem; color: var(--muted); font-weight: 400; }
    .subtitle span { color: #a78bfa; font-weight: 600; }
    .page { position: relative; z-index: 10; max-width: 1060px; margin: 0 auto; padding: 0 1.5rem 4rem; display: grid; grid-template-columns: 1fr 360px; gap: 1.8rem; align-items: start; }
    @media (max-width: 860px) { .page { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 2rem; backdrop-filter: blur(20px); }
    .card-head { font-size: 1rem; font-weight: 700; margin-bottom: 1.6rem; display: flex; align-items: center; gap: 10px; }
    .card-head .ico { font-size: 1.35rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.9px; }
    input, select { background: var(--input); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.93rem; padding: 0.65rem 0.9rem; outline: none; width: 100%; transition: border 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    select option { background: #111827; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.18); }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 99px; outline: none; padding: 0; border: none; cursor: pointer; }
    .sval { min-width: 30px; text-align: center; font-weight: 700; font-size: 1rem; color: var(--teal); }
    .btn { width: 100%; margin-top: 1.8rem; padding: 1rem; border: none; border-radius: 12px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7c5cfc 0%, #5b3fd8 100%); box-shadow: 0 6px 28px rgba(124, 92, 252, 0.42); transition: transform 0.18s, box-shadow 0.18s; position: relative; overflow: hidden; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 38px rgba(124, 92, 252, 0.55); }
    .btn:active { transform: translateY(0); }
    .btn.loading { opacity: 0.75; pointer-events: none; }
    .btn .spin-wrap { display: none; }
    .btn.loading .btn-label { opacity: 0; }
    .btn.loading .spin-wrap { display: flex; position: absolute; inset: 0; align-items: center; justify-content: center; }
    .spin { width: 22px; height: 22px; border: 3px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-side { position: sticky; top: 1.4rem; display: flex; flex-direction: column; gap: 1.2rem; }
    .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem 1.8rem; backdrop-filter: blur(20px); min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .idle-state { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .idle-house { font-size: 3.5rem; line-height: 1; animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .idle-text { color: var(--muted); font-size: 0.9rem; max-width: 200px; line-height: 1.6; }
    .res-state { display: none; width: 100%; flex-direction: column; align-items: center; gap: 6px; }
    .res-state.show { display: flex; }
    .res-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
    .res-price { font-size: clamp(2rem, 5vw, 2.9rem); font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #b09fff 0%, #00c9a7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .res-sub { font-size: 0.83rem; color: var(--muted); margin-bottom: 1rem; }
    .res-rows { width: 100%; border-top: 1px solid var(--border); padding-top: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; text-align: left; }
    .res-row { display: flex; justify-content: space-between; align-items: center; }
    .res-row .lbl { color: var(--muted); font-size: 0.82rem; }
    .res-row .val { font-weight: 700; font-size: 0.92rem; }
    .info-card { background: linear-gradient(135deg, rgba(124, 92, 252, 0.12), rgba(0, 201, 167, 0.06)); border: 1px solid rgba(124, 92, 252, 0.2); border-radius: 16px; padding: 1.4rem 1.6rem; }
    .info-card h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; }
    .info-items { display: flex; flex-direction: column; gap: 0.55rem; }
    .info-item { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); }
    .info-item .dot { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; flex-shrink: 0; }
    .err-box { width: 100%; background: rgba(255, 80, 80, 0.1); border: 1px solid rgba(255, 80, 80, 0.25); border-radius: 10px; padding: 0.9rem 1.1rem; color: #ff7070; font-size: 0.86rem; margin-top: 1rem; display: none; text-align: left; }
    .err-box.show { display: block; }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <header>
    <div class="tag"><span class="tag-dot"></span> 机器学习 & 深度学习</div>
    <h1>中国房价预测</h1>
    <p class="subtitle">基于 <span>AI 模型</span> 的中国房产价格智能估算</p>
  </header>

  <div class="page">
    <div class="card">
      <div class="card-head"><span class="ico">🏗️</span> 房产信息</div>
      <form id="form">
        <div class="grid">
          <div class="field">
            <label>城市</label>
            <select id="city">
              {% for c in cities %}<option>{{ c }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>房产类型</label>
            <select id="property_type">
              {% for t in prop_types %}<option>{{ t }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>区域/商圈</label>
            <input type="text" id="district" placeholder="如：朝阳区、陆家嘴" />
          </div>
          <div class="field">
            <label>装修状态</label>
            <select id="decoration">
              {% for d in decorations %}<option>{{ d }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>电梯</label>
            <select id="elevator">
              {% for e in elevators %}<option>{{ e }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>朝向</label>
            <select id="orientation">
              {% for o in orientations %}<option>{{ o }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label>建筑面积 (平方米)</label>
            <input type="number" id="area" value="100" min="20" max="2000" />
          </div>
          <div class="field">
            <label>室 (卧室)</label>
            <div class="slider-row">
              <input type="range" id="room" min="1" max="6" value="2" oninput="document.getElementById('room_v').textContent=this.value" />
              <span class="sval" id="room_v">2</span>
            </div>
          </div>
          <div class="field">
            <label>厅 (客厅)</label>
            <div class="slider-row">
              <input type="range" id="hall" min="0" max="3" value="1" oninput="document.getElementById('hall_v').textContent=this.value" />
              <span class="sval" id="hall_v">1</span>
            </div>
          </div>
          <div class="field">
            <label>卫 (卫生间)</label>
            <div class="slider-row">
              <input type="range" id="bathroom" min="1" max="5" value="1" oninput="document.getElementById('bath_v').textContent=this.value" />
              <span class="sval" id="bath_v">1</span>
            </div>
          </div>
          <div class="field">
            <label>楼层</label>
            <input type="number" id="floor" value="10" min="1" max="100" />
          </div>
          <div class="field">
            <label>总楼层</label>
            <input type="number" id="total_floors" value="26" min="1" max="100" />
          </div>
          <div class="field">
            <label>房龄 (年)</label>
            <div class="slider-row">
              <input type="range" id="age" min="0" max="30" value="5" oninput="document.getElementById('age_v').textContent=this.value" />
              <span class="sval" id="age_v">5</span>
            </div>
          </div>
          <div class="field">
            <label>地铁距离 (分钟)</label>
            <div class="slider-row">
              <input type="range" id="metro_distance" min="0" max="30" value="5" oninput="document.getElementById('metro_v').textContent=this.value" />
              <span class="sval" id="metro_v">5</span>
            </div>
          </div>
          <div class="field">
            <label>学区评分 (1-10)</label>
            <div class="slider-row">
              <input type="range" id="school_score" min="1" max="10" step="0.1" value="6.5" oninput="document.getElementById('school_v').textContent=this.value" />
              <span class="sval" id="school_v">6.5</span>
            </div>
          </div>
          <div class="field">
            <label>设施数量</label>
            <div class="slider-row">
              <input type="range" id="amenities_count" min="0" max="20" value="5" oninput="document.getElementById('amen_v').textContent=this.value" />
              <span class="sval" id="amen_v">5</span>
            </div>
          </div>
        </div>
        <button type="submit" class="btn" id="btn">
          <span class="btn-label">✨ 获取房价估算</span>
          <span class="spin-wrap"><div class="spin"></div></span>
        </button>
        <div class="err-box" id="err"></div>
      </form>
    </div>

    <div class="result-side">
      <div class="result-card">
        <div class="idle-state" id="idle">
          <div class="idle-house">🏠</div>
          <p class="idle-text">填写房产信息，点击 <strong>获取房价估算</strong> 获取 AI 价格预测</p>
        </div>
        <div class="res-state" id="result">
          <div class="res-label">预估市场价格</div>
          <div class="res-price" id="r-price"></div>
          <div class="res-sub" id="r-sub"></div>
          <div class="res-rows">
            <div class="res-row"><span class="lbl">总价 (万元)</span><span class="val" id="r-wan"></span></div>
            <div class="res-row"><span class="lbl">总价 (元)</span><span class="val" id="r-cny"></span></div>
            <div class="res-row"><span class="lbl">单价 (元/平米)</span><span class="val" id="r-sqm"></span></div>
          </div>
        </div>
      </div>
      <div class="info-card">
        <h3>✅ 为什么信任这个预测？</h3>
        <div class="info-items">
          <div class="info-item"><span class="dot"></span>基于真实中国房产数据训练</div>
          <div class="info-item"><span class="dot"></span>集成机器学习与深度学习模型</div>
          <div class="info-item"><span class="dot"></span>考虑城市、地段、面积、学区等因素</div>
          <div class="info-item"><span class="dot"></span>预测耗时小于1秒</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      btn.classList.add('loading');
      err.classList.remove('show');

      const payload = {
        city: document.getElementById('city').value,
        district: document.getElementById('district').value || '未知',
        property_type: document.getElementById('property_type').value,
        area: document.getElementById('area').value,
        room: document.getElementById('room').value,
        hall: document.getElementById('hall').value,
        bathroom: document.getElementById('bathroom').value,
        floor: document.getElementById('floor').value,
        total_floors: document.getElementById('total_floors').value,
        age: document.getElementById('age').value,
        decoration: document.getElementById('decoration').value,
        elevator: document.getElementById('elevator').value,
        orientation: document.getElementById('orientation').value,
        metro_distance: document.getElementById('metro_distance').value,
        school_score: document.getElementById('school_score').value,
        amenities_count: document.getElementById('amenities_count').value,
      };

      try {
        const res = await fetch('http://localhost:7860/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const wan = data.price_wan;
        const cny = data.price_cny;
        const sqm = data.price_per_sqm;

        document.getElementById('r-price').textContent = `¥ ${wan.toLocaleString()} 万`;
        document.getElementById('r-sub').textContent = `约 ¥ ${cny.toLocaleString()} 元`;
        document.getElementById('r-wan').textContent = `¥ ${wan.toLocaleString()} 万`;
        document.getElementById('r-cny').textContent = `¥ ${cny.toLocaleString()}`;
        document.getElementById('r-sqm').textContent = `¥ ${Math.round(sqm).toLocaleString()} /㎡`;

        document.getElementById('idle').style.display = 'none';
        document.getElementById('result').classList.add('show');
      } catch (ex) {
        err.textContent = '⚠ ' + ex.message;
        err.classList.add('show');
      } finally {
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
